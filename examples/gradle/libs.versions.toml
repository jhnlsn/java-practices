# Versions for everything Spring Boot's BOM does not manage. Libraries listed
# without a version (Testcontainers, AssertJ, Awaitility) are managed by the
# Boot dependency-management plugin — do not pin them here.
[versions]
spring-boot = "3.5.16"
spring-dependency-management = "1.1.7"
wiremock = "3.13.2"
# 1.4.x matches the JUnit Platform that Boot 3.5 manages (1.12.x);
# ArchUnit 1.5+ compiles against Platform 1.14 (the Boot 4 line).
archunit = "1.4.1"
pitest-plugin = "1.19.0"
pitest-core = "1.25.9"
pitest-junit5 = "1.2.3"

[libraries]
spring-boot-starter-web = { module = "org.springframework.boot:spring-boot-starter-web" }
spring-boot-starter-validation = { module = "org.springframework.boot:spring-boot-starter-validation" }
spring-boot-starter-data-jpa = { module = "org.springframework.boot:spring-boot-starter-data-jpa" }
flyway-core = { module = "org.flywaydb:flyway-core" }
flyway-postgresql = { module = "org.flywaydb:flyway-database-postgresql" }
postgresql = { module = "org.postgresql:postgresql" }
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }
archunit-junit5 = { module = "com.tngtech.archunit:archunit-junit5", version.ref = "archunit" }
spring-boot-testcontainers = { module = "org.springframework.boot:spring-boot-testcontainers" }
testcontainers-junit-jupiter = { module = "org.testcontainers:junit-jupiter" }
testcontainers-postgresql = { module = "org.testcontainers:postgresql" }
awaitility = { module = "org.awaitility:awaitility" }
assertj-core = { module = "org.assertj:assertj-core" }
wiremock-standalone = { module = "org.wiremock:wiremock-standalone", version.ref = "wiremock" }

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
spring-dependency-management = { id = "io.spring.dependency-management", version.ref = "spring-dependency-management" }
pitest = { id = "info.solidsoft.pitest", version.ref = "pitest-plugin" }
