# Mirrors the testing playbook §7 PR gate order:
#   compile → unit/slice → integration
# (mutation testing joins in Phase 5 as a reported trend, not a blocking step)
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Compile
        run: ./gradlew classes testClasses

      - name: Unit and slice tests
        run: ./gradlew test

      - name: Integration tests
        run: ./gradlew integrationTest

  # Adversarial review §7 — mutation score is a trend to watch, not a merge
  # gate. This job never blocks a PR; read the uploaded report for the score.
  mutation-report:
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: examples
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Mutation testing (domain packages only)
        run: ./gradlew pitest

      - uses: actions/upload-artifact@v4
        with:
          name: pitest-report
          path: examples/transfers/build/reports/pitest
